name: Tests

# Branches werden ueber ihren Pull Request getestet; ein Push laeuft nur auf main,
# sonst liefe jeder Push auf einen Branch mit offenem Pull Request doppelt.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fruit-ninja-cv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: fruit-ninja-cv/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      # Gesichtsmodelle (YuNet/SFace) laden die Tests beim ersten Mal herunter
      - uses: actions/cache@v4
        with:
          path: fruit-ninja-cv/models
          key: face-models-${{ hashFiles('fruit-ninja-cv/face_id.py') }}
      - run: python -m pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: fruit-ninja-cv/test-results.xml
